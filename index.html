<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.50">
    <title>TSC || SELECTOR</title>
    <link rel="stylesheet" href="style.css">
    <style>
        img,
        source {
        width: 40%;
        height: 20%;
        }
        h2 {
            font-size: clamp(1rem, 1.25rem, 1.50rem);
            padding-top: clamp(0.25rem, 0.50rem, 0.75rem);
            color: grey;
        }
        h4 {
            padding-top: clamp(0.25rem, 0.50rem, 0.75rem);
            padding-bottom: clamp(0.25rem, 0.50rem, 0.75rem);
            color: grey;
        }
        nav {
            max-width: clamp(40rem, 50rem, 60rem);
            margin: 0 auto;
            padding: clamp(1rem, 1.25rem, 1.5rem);
        }
        div {
            border: clamp(0.03125rem, 0.0625rem, 0.09375rem) solid grey;
            padding: clamp(0.5rem, 1rem, 1.5rem);
            margin-bottom: clamp(0.5rem, 1rem, 1.5rem);
            border-radius: clamp(0.15625rem, 0.3125rem, 0.46875rem);
        }
        a {
            background-color: seagreen;
            cursor: pointer;
        }
        a[aria-disabled="true"] {
            padding: 6px;
            border-radius: 16px;
            background-color: indianred;
            font: inherit;
            cursor: not-allowed;
            text-decoration: none;
        }
        #darkmode-button {
            background-image: url("images/sun.png");
            background-size: cover;
            background-color: #FFFF;
            filter: invert(85%);
            width: clamp(2rem, 2.3rem, 3rem);
            height: clamp(2rem, 2.3rem, 3rem);
            position: relative;
            top: clamp(0.25rem, 0.5rem, 0.75rem);
            left: clamp(0.125rem, 0.25rem, 0.375rem);
            border-radius: 75%;
            display: flex;
            align-items: center;
        }
        html#darkmode #darkmode-button {
            background-color: black;
            background-image: url("images/moon.png");
        }
        html#darkmode div {
        border-color: floralwhite;
        }
        html#darkmode a[aria-disabled="true"] {
            background-color: salmon;
        }
        html#darkmode a {
            background-color: forestgreen;
        }
    </style>
        <script src="script.js" defer></script>
        <script type="module">
        document.getElementById("darkmode-button").addEventListener("click", () => {
            sessionStorage.setItem("darkMode", !JSON.parse(sessionStorage.getItem("darkMode")));
            location.reload();
        });
    </script>
    <link rel="icon" type="image/x-icon" href="/images/TSC_Logo.png">
</head>
<body>
    <button id="darkmode-button"></button>
    <picture>
        <source srcset="images/TSC_Logo.avif" type="image/avif">
        <source srcset="images/TSC_Logo.webp" type="image/webp">
        <img src="images/TSC_Logo.png" alt="The Shattered Crown Logo">
    </picture>
    <nav>
        <h1>Looking for pixel artists at the moment!</h1>
        <h2>What did you want to do?</h2>
        <br>
        <div>
            <h2>Pixel Art</h2>
            <h4>Create 2D pixel art for the game.</h4>
            <a href="Pixel-art.html">SELECT</a>
        </div>
        <div>
            <h2>Development</h2>
            <h4>Develop and implement game logic, features, and tools.</h4>
            <a href="Development.html" aria-disabled="true" tabindex="-1">SELECT</a>
        </div>
        <div>
            <h2>Music Composition</h2>
            <h4>Create soundtracks and sound effects for the game.</h4>
            <a href="Music-composition.html" aria-disabled="true" tabindex="-1">SELECT</a>
        </div>
    </nav>
</body>
</html>
